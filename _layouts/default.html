<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{ page.excerpt | default: site.description | default: 'Writing and project notes from Isaac Hua.' | strip_html | normalize_whitespace | escape }}">
  <title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <link rel="icon" type="image/jpeg" href="{{ '/images/ISAAC_HUA_PICTURE_CROPPED.jpg' | relative_url }}">

  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --font-body: "IBM Plex Sans", sans-serif;
      --font-display: "IBM Plex Serif", serif;
      color-scheme: dark;
    }

    /* Shared type choices keep the writing surface connected to the portfolio without reducing readability. */
    body {
      min-width: 320px;
      font-family: var(--font-body);
      background: #0f0f0f;
      color: #f3f4f6;
    }

    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
      font-family: var(--font-display);
    }

    /* Author-level link color prevents visited links from falling back to the browser's purple default. */
    a {
      color: inherit;
    }

    /* Accent links keep their semantic color in both unvisited and visited browser states. */
    a.text-amber-100,
    a.text-amber-100:visited {
      color: #fef3c7;
    }

    a.text-amber-100:hover {
      color: #fde68a;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 5rem;
    }

    ::selection {
      background: #fde68a;
      color: #171717;
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }
    }
  </style>
</head>

<body class="antialiased">
  <header class="sticky top-0 z-50 border-b border-neutral-800 bg-neutral-950 px-4 sm:px-6 lg:px-8">
    <div class="container mx-auto flex min-h-16 max-w-6xl items-center justify-between gap-5">
      <p class="shrink-0 text-sm font-semibold tracking-[-0.01em] text-neutral-100">
        <a href="{{ '/' | prepend: site.baseurl }}" class="transition hover:text-amber-100 focus:outline-none focus:ring-2 focus:ring-amber-100 focus:ring-offset-4 focus:ring-offset-neutral-950">
          Isaac Hua
        </a>
      </p>

      <nav aria-label="Primary">
        <ul class="flex items-center gap-x-5 text-sm font-medium text-neutral-400 sm:gap-x-7">
          <li><a href="{{ '/#projects' | prepend: site.baseurl }}" class="transition hover:text-neutral-100 focus:outline-none focus:ring-2 focus:ring-amber-100 focus:ring-offset-4 focus:ring-offset-neutral-950">Work</a></li>
          <li class="hidden sm:list-item"><a href="{{ '/#approach' | prepend: site.baseurl }}" class="transition hover:text-neutral-100 focus:outline-none focus:ring-2 focus:ring-amber-100 focus:ring-offset-4 focus:ring-offset-neutral-950">Approach</a></li>
          <li class="hidden md:list-item"><a href="{{ '/#about' | prepend: site.baseurl }}" class="transition hover:text-neutral-100 focus:outline-none focus:ring-2 focus:ring-amber-100 focus:ring-offset-4 focus:ring-offset-neutral-950">About</a></li>
          <li><a href="{{ '/blog/' | prepend: site.baseurl }}" class="text-amber-100 transition hover:text-amber-200 focus:outline-none focus:ring-2 focus:ring-amber-100 focus:ring-offset-4 focus:ring-offset-neutral-950" aria-current="page">Writing</a></li>
          <li><a href="{{ '/#contact' | prepend: site.baseurl }}" class="transition hover:text-neutral-100 focus:outline-none focus:ring-2 focus:ring-amber-100 focus:ring-offset-4 focus:ring-offset-neutral-950">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container mx-auto max-w-6xl px-4 py-14 sm:px-6 sm:py-20 lg:px-8">
    {{ content }}
  </main>

  <footer class="border-t border-neutral-800 px-4 py-8 text-sm text-neutral-500 sm:px-6 lg:px-8">
    <div class="container mx-auto flex max-w-6xl flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
      <p>&copy; {{ "now" | date: "%Y" }} Isaac Hua.</p>
      <a href="{{ '/' | prepend: site.baseurl }}" class="font-semibold text-neutral-400 transition hover:text-amber-100 focus:outline-none focus:ring-2 focus:ring-amber-100 focus:ring-offset-4 focus:ring-offset-neutral-950">
        Portfolio &rarr;
      </a>
    </div>
  </footer>
</body>
</html>
