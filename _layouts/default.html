<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace | escape }}">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <link rel="icon" type="image/jpeg" href="{{ '/images/ISAAC_HUA_PICTURE_CROPPED.jpg' | relative_url }}">
  <link rel="stylesheet" href="{{ '/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header reading">
    <a href="{{ '/' | relative_url }}" class="site-name">{{ site.title | escape }}</a>
    <nav aria-label="Main">
      <a href="{{ '/#projects' | relative_url }}">Work</a>
      <a href="{{ '/#about' | relative_url }}">About</a>
      {% if page.url == '/' %}
      <a href="#writing">Writing</a>
      {% else %}
      <a href="{{ '/blog/' | relative_url }}"{% if page.url == '/blog/' %} aria-current="page"{% endif %}>Writing</a>
      {% endif %}
    </nav>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site-footer reading" id="contact">
    <p>Welcome to DM me for a chat.</p>
    <div class="contact">
      <a href="https://www.linkedin.com/in/isaachua/">LinkedIn</a>
      <a href="mailto:isaachuahy@gmail.com">Email</a>
      <a href="https://github.com/isaachuahy">GitHub</a>
    </div>
  </footer>
</body>
</html>
