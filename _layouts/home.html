<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Isaac Hua builds practical applied AI, data, and product systems around real decisions.">
  <title>{% if page.title == "Home" %}{{ site.title }}{% else %}{{ page.title }} · {{ site.title }}{% endif %}</title>
  <link rel="icon" type="image/jpeg" href="{{ '/images/ISAAC_HUA_PICTURE_CROPPED.jpg' | relative_url }}">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --font-body: "IBM Plex Sans", sans-serif;
      --font-display: "IBM Plex Serif", serif;
      color-scheme: dark;
    }

    /* The body type stays highly legible while display type carries the site's technical personality. */
    body {
      min-width: 320px;
      font-family: var(--font-body);
      background: #0f0f0f;
      color: #f3f4f6;
    }

    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
      font-family: var(--font-display);
    }

    /* Author-level link color prevents visited links from falling back to the browser's purple default. */
    a {
      color: inherit;
    }

    /* Accent links keep their semantic color in both unvisited and visited browser states. */
    a.text-amber-100,
    a.text-amber-100:visited {
      color: #fef3c7;
    }

    a.text-amber-100:hover {
      color: #fde68a;
    }

    /* Native smooth scrolling replaces per-link JavaScript and remains optional for motion-sensitive visitors. */
    html {
      scroll-behavior: smooth;
      scroll-padding-top: 5rem;
    }

    ::selection {
      background: #fde68a;
      color: #171717;
    }

    /* One restrained opening moment gives the homepage presence without animating every section. */
    @media (prefers-reduced-motion: no-preference) {
      #hero > div {
        animation: hero-arrival 700ms cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      @keyframes hero-arrival {
        from {
          opacity: 0.4;
          transform: translateY(18px);
          filter: blur(4px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
          filter: blur(0);
        }
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }
    }
  </style>
</head>

<body class="antialiased">
  <header class="sticky top-0 z-50 border-b border-neutral-800 bg-neutral-950 px-4 sm:px-6 lg:px-8">
    <div class="container mx-auto flex min-h-16 max-w-6xl items-center justify-between gap-5">
      <h1 class="shrink-0 text-sm font-semibold tracking-[-0.01em] text-neutral-100">
        <a href="{{ '/' | prepend: site.baseurl }}" class="transition hover:text-amber-100 focus:outline-none focus:ring-2 focus:ring-amber-100 focus:ring-offset-4 focus:ring-offset-neutral-950">
          Isaac Hua
        </a>
      </h1>

      <nav aria-label="Primary">
        <ul class="flex items-center gap-x-5 text-sm font-medium text-neutral-400 sm:gap-x-7">
          <li><a href="#projects" class="transition hover:text-neutral-100 focus:outline-none focus:ring-2 focus:ring-amber-100 focus:ring-offset-4 focus:ring-offset-neutral-950">Work</a></li>
          <li class="hidden sm:list-item"><a href="#approach" class="transition hover:text-neutral-100 focus:outline-none focus:ring-2 focus:ring-amber-100 focus:ring-offset-4 focus:ring-offset-neutral-950">Approach</a></li>
          <li class="hidden md:list-item"><a href="#about" class="transition hover:text-neutral-100 focus:outline-none focus:ring-2 focus:ring-amber-100 focus:ring-offset-4 focus:ring-offset-neutral-950">About</a></li>
          <li><a href="{{ '/blog/' | prepend: site.baseurl }}" class="transition hover:text-neutral-100 focus:outline-none focus:ring-2 focus:ring-amber-100 focus:ring-offset-4 focus:ring-offset-neutral-950">Writing</a></li>
          <li><a href="#contact" class="text-amber-100 transition hover:text-amber-200 focus:outline-none focus:ring-2 focus:ring-amber-100 focus:ring-offset-4 focus:ring-offset-neutral-950">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="border-t border-neutral-800 px-4 py-8 text-sm text-neutral-500 sm:px-6 lg:px-8">
    <div class="container mx-auto flex max-w-6xl flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
      <p>&copy; {{ "now" | date: "%Y" }} Isaac Hua.</p>
      <a href="#hero" class="font-semibold text-neutral-400 transition hover:text-amber-100 focus:outline-none focus:ring-2 focus:ring-amber-100 focus:ring-offset-4 focus:ring-offset-neutral-950">
        Back to top &uarr;
      </a>
    </div>
  </footer>
</body>
</html>
