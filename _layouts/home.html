<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* Keep the shared homepage shell responsible for global page styling. */
    body {
      font-family: 'Inter', sans-serif;
      background-color: #111827;
      color: #f3f4f6;
    }

    /* Fade sections in once they enter the viewport to keep motion minimal. */
    .fade-in-section {
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.6s ease-out, transform 0.6s ease-out;
    }

    .fade-in-section.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .accent-color {
      color: #14b8a6;
    }

    .bg-accent-color {
      background-color: #14b8a6;
    }

    .border-accent-color {
      border-color: #14b8a6;
    }

    .hover\:bg-accent-dark:hover {
      background-color: #0f766e;
    }

    .hover\:text-accent-light:hover {
      color: #5eead4;
    }
  </style>
</head>
<body class="antialiased">
  <header class="py-2 sm:py-6 px-3 sm:px-6 lg:px-8 sticky top-0 z-50 bg-gray-900 bg-opacity-90 backdrop-blur-md">
    <div class="container mx-auto flex justify-between items-center">
      <h1 class="text-lg sm:text-2xl font-bold">
        <a href="{{ '/' | prepend: site.baseurl }}">{{ site.title }}</a>
      </h1>
      <nav>
        <ul class="flex space-x-3 sm:space-x-6 text-sm sm:text-base">
          <li><a href="{{ '/blog/' | prepend: site.baseurl }}" class="font-semibold hover:text-accent-light transition duration-300">Blog</a></li>
          <li><a href="#about" class="hover:text-accent-light transition duration-300">About</a></li>
          <li><a href="#skills" class="hover:text-accent-light transition duration-300">Skills</a></li>
          <li><a href="#projects" class="hover:text-accent-light transition duration-300">Projects</a></li>
          <li><a href="#contact" class="hover:text-accent-light transition duration-300">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="py-8 px-4 sm:px-6 lg:px-8 text-center text-gray-400">
    <div class="container mx-auto">
      <p>&copy; {{ "now" | date: "%Y" }} Isaac Hua. All Rights Reserved.</p>
    </div>
  </footer>

  <script>
    // The homepage marks major sections with .fade-in-section for light editorial motion.
    const sections = document.querySelectorAll('.fade-in-section');
    const observerOptions = {
      root: null,
      rootMargin: '0px',
      threshold: 0.1
    };

    const observer = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        // Once a section is visible, leave it visible so scrolling feels stable.
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
        }
      });
    }, observerOptions);

    sections.forEach((section) => {
      // Each section opts into the same observer instead of owning duplicate animation code.
      observer.observe(section);
    });

    document.querySelectorAll('a[href^="#"]').forEach((anchor) => {
      anchor.addEventListener('click', (event) => {
        const targetId = anchor.getAttribute('href');

        // Only intercept real in-page anchors so external navigation remains untouched.
        if (targetId && targetId !== '#') {
          const targetElement = document.querySelector(targetId);

          if (targetElement) {
            event.preventDefault();
            targetElement.scrollIntoView({
              behavior: 'smooth'
            });
          }
        }
      });
    });
  </script>
</body>
</html>
