<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* The shell sets the neutral canvas used by the homepage sections. */
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0f0f0f;
      color: #f3f4f6;
    }

    /* Sections opt into one restrained reveal instead of animated decoration. */
    .fade-in-section {
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 0.6s ease-out, transform 0.6s ease-out;
    }

    .fade-in-section.is-visible {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body class="antialiased">
  <header class="sticky top-0 z-50 border-b border-neutral-800/80 bg-neutral-950/85 px-4 py-4 backdrop-blur-md sm:px-6 lg:px-8">
    <div class="container mx-auto flex justify-between items-center">
      <h1 class="text-sm font-semibold uppercase tracking-[0.22em] text-neutral-100">
        <a href="{{ '/' | prepend: site.baseurl }}" class="transition hover:text-amber-100">{{ site.title }}</a>
      </h1>
      <nav>
        <ul class="flex flex-wrap justify-end gap-x-4 gap-y-2 text-xs font-semibold uppercase tracking-[0.16em] text-neutral-400 sm:gap-x-6">
          <li><a href="#projects" class="transition hover:text-amber-100">Work</a></li>
          <li><a href="#skills" class="transition hover:text-amber-100">How I build</a></li>
          <li><a href="#about" class="transition hover:text-amber-100">About</a></li>
          <li><a href="{{ '/blog/' | prepend: site.baseurl }}" class="transition hover:text-amber-100">Blog</a></li>
          <li><a href="#contact" class="transition hover:text-amber-100">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="border-t border-neutral-800 px-4 py-8 text-sm text-neutral-500 sm:px-6 lg:px-8">
    <div class="container mx-auto flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
      <p>&copy; {{ "now" | date: "%Y" }} Isaac Hua.</p>
      <a href="#hero" class="font-semibold uppercase tracking-[0.16em] transition hover:text-amber-100">Top</a>
    </div>
  </footer>

  <script>
    // Sections reveal once, which keeps long-form reading stable after the first pass.
    const sections = document.querySelectorAll('.fade-in-section');
    const observerOptions = {
      root: null,
      rootMargin: '0px',
      threshold: 0.1
    };

    const observer = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
        }
      });
    }, observerOptions);

    sections.forEach((section) => {
      observer.observe(section);
    });

    document.querySelectorAll('a[href^="#"]').forEach((anchor) => {
      anchor.addEventListener('click', (event) => {
        const targetId = anchor.getAttribute('href');

        if (targetId && targetId !== '#') {
          const targetElement = document.querySelector(targetId);

          if (targetElement) {
            event.preventDefault();
            targetElement.scrollIntoView({
              behavior: 'smooth'
            });
          }
        }
      });
    });
  </script>
</body>
</html>
