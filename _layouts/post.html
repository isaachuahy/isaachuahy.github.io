---
layout: default
---

<article class="page reading" aria-labelledby="article-title">
  <header class="page-header">
    <h1 id="article-title">{{ page.title | escape }}</h1>
    <time class="article-date" datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
    {% if page.description %}
    <p>{{ page.description | escape }}</p>
    {% endif %}
  </header>

  <div class="article-body">
    {{ content }}
  </div>

  <a class="article-back" href="{{ '/blog/' | relative_url }}">All writing</a>
</article>
