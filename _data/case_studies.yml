  eyebrow: Completed project
  status: Completed
  group: past
  image: images/VisualMAE_DISTILLED.png
  image_alt: Visual masked autoencoder synthesis diagram
  summary: A synthesis exploring masked autoencoders, teacher-student training, transformers, Gaussian processes, and skip-gram models.
  problem: Modern representation learning methods are powerful but easy to treat as isolated techniques without understanding how their assumptions and training objectives differ.
  system_built:
    - Technical synthesis of transformer and autoencoder concepts
    - Exploration of masked autoencoders for visual classification
    - Review of teacher-student training patterns
    - Connections across Gaussian processes and skip-gram models
  technical_decisions:
    - Focused on explaining relationships between model families instead of presenting them as disconnected topics.
    - Used visual classification and masked reconstruction as the anchor for understanding representation learning.
    - Connected architecture choices to training objectives and downstream use.
