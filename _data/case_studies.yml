- slug: david
  title: "David"
  eyebrow: Featured system
  status: In active use
  group: current
  image: images/davidpic.png
  image_alt: "Illustration of King David with a harp"
  hook: "I plan my week in Telegram. If David suggests moving a meeting, I get the final say."
  summary: "David reads my Google Calendar and uses summaries its synthesisers write after our planning sessions. It also draws on my long-term goals and the background I’ve shared over time. I approve calendar changes in Telegram before David applies them. David runs on AWS Lightsail."
  problem: Planning & scheduling breaks when goals live in one place, the calendar lives somewhere else, and daily decisions happen under pressure. Enterprise & common solutions like Motion or TrevorAI conduct planning & scheduling with algorithms and un-intuitive decision-making that don't reflect the reality of human workflows. David exists to keep all these layers in conversation and understands how you work.
  system_built:
    - Telegram conversational interface and context management
    - Google Calendar context injection
    - Approval-gated calendar writes
    - Session-aware memory
    - Recurring check-ins
    - Decision logs grounded in weekly state
  technical_decisions:
    # The strongest operating-boundary decision stays first because compact views use it as the project signal.
    - Calendar writes require explicit approval so David suggests actions without silently changing the user's calendar or context.
    - Live calendar context keeps recommendations scoped to historical and current constraints rather than generic planning advice.
    - Memory is scoped to planning context so continuity stays useful and grounded.
  stack:
    - Python
    - FastAPI
    - Gemini
    - Google Calendar API
    - AWS Lightsail
    - Backblaze B2
  evidence:
    - label: Repository
      url: https://github.com/isaachuahy/david#demo
      text: "Watch the demo & view repository"

