- slug: ml-monitor
  title: "ML Model Monitoring"
  eyebrow: Completed project
  status: Completed
  group: past
  image: images/MLMonitorDashboard.png
  image_alt: "Monitoring dashboard showing accuracy and F1 score over time"
  image_style: top
  hook: "The model shipped. How do I know it still works?"
  summary: "I built a FastAPI service and a Streamlit dashboard to track what happens after deployment. I use a KS test to flag changes in the input data without waiting for labels. I track accuracy and F1 separately because drift alone can’t tell me whether predictions got worse."
  problem: Production ML models can degrade after deployment when input data shifts, performance changes, or teams lack a clear view into model health.
  system_built:
    - FastAPI inference service
    - Performance metric tracking
    - Data drift detection
    - Hot-reloading model support
    - Streamlit monitoring dashboard
    - Discord webhook alerting
  technical_decisions:
    # Compact project rows surface the first decision, so it leads with the core implementation tradeoff.
    - Kept inference and monitoring deployable without introducing a heavy MLOps platform.
    - Used dashboard visibility and alerting so model issues could be noticed before they became silent failures.
    - Supported hot-reloading to reduce friction when swapping or updating models.
  stack:
    - Python
    - FastAPI
    - PostgreSQL
    - Streamlit
    - MLOps
    - Discord webhooks
  evidence:
    - label: Repository
      url: https://github.com/isaachuahy/ml-monitor
      text: "ML Model Monitoring on GitHub"

