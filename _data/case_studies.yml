- slug: david
  title: David
  eyebrow: Featured system
  status: In active use
  group: current
  image: images/davidpic.png
  image_alt: David executive AI assistant interface
  summary: An AI executive assistant that connects long-running goals with weekly planning, calendar context, and approval-gated scheduling.
  problem: Planning breaks when goals live in one place, the calendar lives somewhere else, and daily decisions happen under pressure. David exists to keep those layers in conversation.
  system_built:
    - Telegram conversational interface
    - Google Calendar context injection
    - Approval-gated calendar writes
    - Session-aware memory
    - Recurring check-ins
    - Decision logs grounded in weekly state
  technical_decisions:
    - Calendar writes require explicit approval so the assistant can suggest actions without silently changing a user's schedule.
    - Memory is scoped around useful continuity, keeping the system grounded in goals, weekly state, and decision history.
    - Live calendar context keeps recommendations tied to real time constraints instead of generic planning advice.
  stack:
    - Python
    - FastAPI
    - Gemini
    - Google Calendar API
    - AWS Lightsail
    - Backblaze B2
  evidence:
    - label: Repository
      url: https://github.com/isaachuahy/david

- slug: ml-monitor
  title: ML Model Monitoring System
  eyebrow: Completed project
  status: Completed
  group: past
  image: images/MLMonitorDashboard.png
  image_alt: ML model monitoring dashboard
  summary: A customizable monitoring system for tracking model performance, detecting data drift, and serving low-latency FastAPI inference.
  problem: Production ML models can degrade after deployment when input data shifts, performance changes, or teams lack a clear view into model health.
  system_built:
    - FastAPI inference service
    - Performance metric tracking
    - Data drift detection
    - Hot-reloading model support
    - Streamlit monitoring dashboard
    - Discord webhook alerting
  technical_decisions:
    - Kept inference and monitoring simple enough to deploy without a heavy MLOps platform.
    - Used dashboard visibility and alerting so model issues could be noticed before they became silent failures.
    - Supported hot-reloading to reduce friction when swapping or updating models.
  stack:
    - Python
    - FastAPI
    - PostgreSQL
    - Streamlit
    - MLOps
    - Discord webhooks
  evidence:
    - label: Repository
      url: https://github.com/isaachuahy/ml-monitor

- slug: cocoa-futures
  title: Cocoa Futures Price Modelling
  eyebrow: Completed project
  status: Completed
  group: past
  image: images/CocoaFuturesModel.png
  image_alt: Cocoa futures price forecasting model output
  summary: A comparative time-series forecasting study that identified VARX as the strongest model for cocoa futures price prediction.
  problem: Commodity price forecasting requires comparing model families under realistic back-testing instead of relying on a single preferred method.
  system_built:
    - Comparative forecasting workflow
    - ARIMA-GARCH, ETS, and VARX model evaluation
    - Scripted model fitting
    - Back-testing pipeline
    - Forecast accuracy comparison
  technical_decisions:
    - Compared multiple time-series approaches before selecting the final model.
    - Used scripted fitting and back-testing so evaluation could be repeated and extended.
    - Selected VARX based on comparative predictive performance rather than model familiarity.
  stack:
    - R
    - Time series forecasting
    - forecast
    - rugarch
    - vars
  evidence:
